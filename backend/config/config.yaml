app:
  name: student-aid-system
  env: dev

server:
  port: 8080

database:
  driver: postgres
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: postgres
  name: student_aid_db
  params: "sslmode=disable TimeZone=Asia/Shanghai"

jwt:
  secret: "change-me-in-production"
  expire_hours: 24
  refresh_expire_hours: 168
  issuer: student-aid-system

upload:
  dir: ./uploads
  max_size_mb: 20
  allowed_exts: ".jpg,.jpeg,.png,.pdf,.doc,.docx,.xls,.xlsx"

export:
  # 认定申请表 PDF 导出所用的中文字体（TTF）。需指向一个支持中文的 .ttf 文件，
  # 例如 Noto Sans SC / 思源黑体；留空则导出接口会返回明确的未配置提示。
  pdf_font_path: ""
