app:
  name: student-aid-system
  env: dev

server:
  port: 8080

database:
  driver: postgres
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: postgres
  name: student_aid_db
  params: "sslmode=disable TimeZone=Asia/Shanghai"

jwt:
  secret: "change-me-in-production"
  expire_hours: 24
  refresh_expire_hours: 168
  issuer: student-aid-system

upload:
  dir: ./uploads
  max_size_mb: 20
  allowed_exts: ".jpg,.jpeg,.png,.pdf"

export:
  # pdf_font_path 为历史 fpdf 配置，当前导出已改用 Word 模板，可留空
  pdf_font_path: "./assets/fonts/NotoSansSC-Regular.ttf"
  # 认定表表头「学校」名称（可按本校修改）
  school_name: "黔西南民族职业技术学院"
  # 认定申请表 Word 模板（docx，含 {占位符}），认定通过后导出 docx 时使用
  recognition_template_path: "./assets/templates/recognition_application.docx"
  # 助学金申请表 Word 模板（docx，含 {占位符}），审批通过后导出 docx 时使用
  grant_template_path: "./assets/templates/grant_national_aid.docx"
  # 家庭经济困难学生认定结果汇总表 Excel 模板
  recognition_summary_template_path: "./assets/templates/recognition_result_summary.xlsx"
