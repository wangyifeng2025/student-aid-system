name: student-aid-system

x-backend-build: &backend-build
  context: ../backend
  dockerfile: Dockerfile
  args:
    GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}

x-db-env: &db-env
  SAS_DATABASE_DRIVER: postgres
  SAS_DATABASE_HOST: postgres
  SAS_DATABASE_PORT: "5432"
  SAS_DATABASE_USER: ${POSTGRES_USER:-postgres}
  SAS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  SAS_DATABASE_NAME: ${POSTGRES_DB:-student_aid_db}
  SAS_DATABASE_PARAMS: sslmode=disable TimeZone=Asia/Shanghai

services:
  postgres:
    image: postgres:15.18-trixie
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-student_aid_db}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    image: student-aid-system-backend:local
    build: *backend-build
    restart: unless-stopped
    environment:
      <<: *db-env
      SAS_APP_ENV: ${SAS_APP_ENV:-prod}
      SAS_SERVER_PORT: "8080"
      SAS_JWT_SECRET: ${JWT_SECRET:-qxnzy20260630}
      SAS_JWT_EXPIRE_HOURS: "24"
      SAS_JWT_REFRESH_EXPIRE_HOURS: "168"
      SAS_UPLOAD_DIR: /app/uploads
      SAS_UPLOAD_MAX_SIZE_MB: "20"
      SAS_UPLOAD_ALLOWED_EXTS: ".jpg,.jpeg,.png,.pdf"
      SAS_EXPORT_PDF_FONT_PATH: ${SAS_EXPORT_PDF_FONT_PATH:-}
      SAS_EXPORT_RECOGNITION_TEMPLATE_PATH: /app/assets/templates/recognition_application.docx
      SAS_EXPORT_GRANT_TEMPLATE_PATH: /app/assets/templates/grant_national_aid.docx
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        # 留空：浏览器使用当前站点 origin，经 Nginx 转发 /api
        NEXT_PUBLIC_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  # 演示数据初始化：Go 程序 ./cmd/seed（幂等）。
  # 表结构由 backend 启动时 AutoMigrate；seed 再写入字典/区划/测试账号。
  # 复用 backend 镜像，不再单独打一份。
  # 首次：docker compose up -d --build
  #       docker compose --profile init run --rm seed
  seed:
    profiles: ["init"]
    image: student-aid-system-backend:local
    pull_policy: never
    build: *backend-build
    command: ["seed"]
    environment:
      <<: *db-env
      SAS_APP_ENV: ${SAS_APP_ENV:-prod}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

volumes:
  pgdata:
  uploads:
