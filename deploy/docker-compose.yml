name: student-aid-system

services:
  postgres:
    image: postgres:15.18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-student_aid_db}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
    restart: unless-stopped
    environment:
      SAS_APP_ENV: ${SAS_APP_ENV:-prod}
      SAS_SERVER_PORT: "8080"
      SAS_DATABASE_DRIVER: postgres
      SAS_DATABASE_HOST: postgres
      SAS_DATABASE_PORT: "5432"
      SAS_DATABASE_USER: ${POSTGRES_USER:-postgres}
      SAS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SAS_DATABASE_NAME: ${POSTGRES_DB:-student_aid_db}
      SAS_DATABASE_PARAMS: sslmode=disable TimeZone=Asia/Shanghai
      SAS_JWT_SECRET: ${JWT_SECRET:-qxnzy20260630}
      SAS_JWT_EXPIRE_HOURS: "24"
      SAS_JWT_REFRESH_EXPIRE_HOURS: "168"
      SAS_UPLOAD_DIR: /app/uploads
      SAS_UPLOAD_MAX_SIZE_MB: "20"
      SAS_EXPORT_PDF_FONT_PATH: ${SAS_EXPORT_PDF_FONT_PATH:-}
      SAS_EXPORT_RECOGNITION_TEMPLATE_PATH: /app/assets/templates/recognition_application.docx
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        # 留空：浏览器使用当前站点 origin，经 Nginx 转发 /api
        NEXT_PUBLIC_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine 
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  # 初始化演示数据（字典、测试账号、组织机构）。首次部署执行一次即可。
  seed:
    profiles: ["init"]
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
    command: ["seed"]
    environment:
      SAS_APP_ENV: ${SAS_APP_ENV:-prod}
      SAS_DATABASE_DRIVER: postgres
      SAS_DATABASE_HOST: postgres
      SAS_DATABASE_PORT: "5432"
      SAS_DATABASE_USER: ${POSTGRES_USER:-postgres}
      SAS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SAS_DATABASE_NAME: ${POSTGRES_DB:-student_aid_db}
      SAS_DATABASE_PARAMS: sslmode=disable TimeZone=Asia/Shanghai
      SAS_JWT_SECRET: ${JWT_SECRET:-qxnzy20260630}
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  uploads:
